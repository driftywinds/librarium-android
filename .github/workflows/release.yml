# Builds a signed release APK and attaches it to a GitHub release.
#
# Signing material never enters the repository: the keystore is a base64
# secret decoded into the runner's temp directory, and the passwords, alias
# and key password come from repository secrets. Missing secrets fail the job
# loudly rather than producing an unsigned artifact nobody can install over
# the previous build.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of release.keystore
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
#
# Triggers:
#   - a pushed tag `v<version>` cuts release v<version>;
#   - a manual run whose version_name is given cuts release v<version_name>
#     at the commit it built (leave it empty to only produce an artifact).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version to release (e.g. 1.4.0) — creates release v1.4.0. Empty = artifact only.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list is "tools platform-tools"; the
          # legacy `tools` package is gone from the SDK repository, so asking
          # for it fails the step with "Failed to find package 'tools'" before
          # Gradle ever runs. platform-tools is all this needs from the action.
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install the compile SDK
        shell: bash
        run: |
          # compileSdk 37 is required by the AAR metadata of compose/coil/
          # navigation. Platforms use the minor-version ids now: the package is
          # `platforms;android-37.0`, not `platforms;android-37`. The default
          # channel carries it; the preview-channel retry is only a fallback
          # for the day it moves.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          install() {
            pkg="$1"
            sdkmanager "$pkg" > /dev/null 2>&1 && return 0
            sdkmanager --channel=3 "$pkg" > /dev/null 2>&1 && return 0
            echo "::warning::$pkg was not offered by the SDK repository"
          }
          install "platforms;android-37.0"
          install "build-tools;37.0.0"

      - name: Work out the version
        id: version
        shell: bash
        env:
          # Passed through the environment rather than pasted into the script:
          # a dispatch input is free text, and a value containing a quote or a
          # $(…) would otherwise be executed by the shell.
          VERSION_INPUT: ${{ inputs.version_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF#refs/tags/}"
            name="${name#v}"
          elif [ -n "${VERSION_INPUT}" ]; then
            name="${VERSION_INPUT#v}"
          else
            name="0.0.0-dev"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          # One tag shape for both triggers, so a dispatch release and a
          # pushed tag cannot end up as two spellings of the same version.
          echo "tag=v${name}" >> "$GITHUB_OUTPUT"

      - name: Decode the keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the signed release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${{ steps.version.outputs.name }}"

      - name: Verify the artifact is signed and aligned
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "::error::no release APK was produced"; exit 1; }
          # build-tools is not guaranteed to be on PATH; pick the newest copy.
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          test -n "$apksigner" || { echo "::error::apksigner not found under \$ANDROID_HOME"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | head -5

      - name: Name the artifact
        id: artifact
        shell: bash
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          out="librarium-${GITHUB_RUN_NUMBER}-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$RUNNER_TEMP/$out"
          echo "path=$RUNNER_TEMP/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        # Tags always publish; a manual run publishes too, but only when it was
        # given a version — otherwise it would mint a v0.0.0-dev release nobody
        # meant to cut. Both paths use the same v<version> tag.
        if: github.ref_type == 'tag' || steps.version.outputs.name != '0.0.0-dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # Pins a dispatch-made tag to the commit this build came from, which
          # is what makes the attached APK reproducible from the tag.
          target_commitish: ${{ github.sha }}
          files: ${{ steps.artifact.outputs.path }}
          generate_release_notes: true

      - name: Note that no release was cut
        if: github.ref_type != 'tag' && steps.version.outputs.name == '0.0.0-dev'
        run: echo "::warning::No version_name was given, so this run only produced a workflow artifact — no release was created."

